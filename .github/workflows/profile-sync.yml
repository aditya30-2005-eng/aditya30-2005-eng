name: Profile sync

on:
  schedule:
    - cron: "17 3 * * *"        # every day, 08:47 IST
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - profile.config.json
      - profile_sync.py
      - .github/workflows/profile-sync.yml

permissions:
  contents: write

concurrency:
  group: profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install fonttools==4.53.1 brotli==1.1.0

      - name: Scan my repos and rebuild the profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python profile_sync.py

      - name: Commit as the profile owner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Profile already up to date"; exit 0; fi
          OWNER_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/users/$OWNER" | python -c "import sys, json; print(json.load(sys.stdin)['id'])")
          NAME=$(python -c "import json; print(json.load(open('profile.config.json'))['commit_name'])")
          git config user.name "$NAME"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"
          git add README.md stack.svg latest-repos.svg commit-activity.svg projects.svg id-dashboard.svg
          git commit -m "Update profile from my repositories"
          git push
          
